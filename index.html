<script>
/* ── Imgur CORS Proxy ── */
(function(){
  var PROXY_PREFIX=location.origin+'/api/proxy?url=';
  function proxyUrl(url){
    url=rawSkinUrl(url);
    if(url&&typeof url==='string'&&url.includes('imgur.com')&&
       !url.includes('/api/proxy?url=')&&!url.startsWith('data:'))
      return PROXY_PREFIX+encodeURIComponent(url);
    return url;
  }
  function rawSkinUrl(url){
    if(!url||typeof url!=='string')return url;
    // Strip any nested proxy prefixes so the displayed value is always the
    // bare imgur link, regardless of how it was stored.
    var u=url;
    for(var i=0;i<5;i++){
      var idx=u.indexOf('/api/proxy?url=');
      if(idx<0)break;
      try{u=decodeURIComponent(u.slice(idx+'/api/proxy?url='.length));}
      catch(e){break;}
    }
    return u;
  }
  window.proxyUrl=proxyUrl;
  window.rawSkinUrl=rawSkinUrl;
  try{
    var origSetAttr=Element.prototype.setAttribute;
    Element.prototype.setAttribute=function(name,value){
      if(name==='src'&&this.tagName==='IMG'&&value&&typeof value==='string'&&value.includes('imgur.com'))
        value=proxyUrl(value);
      else if(name==='style'&&value&&typeof value==='string'&&value.includes('imgur.com'))
        value=value.replace(/url\(['"]?(https?:\/\/i\.imgur\.com[^'")\s]+)['"]?\)/gi,function(_,u){return"url('"+proxyUrl(u)+"')";});
      return origSetAttr.call(this,name,value);
    };
  }catch(e){}
  try{
    var imgProto=HTMLImageElement.prototype;
    var srcDesc=Object.getOwnPropertyDescriptor(imgProto,'src');
    if(srcDesc&&srcDesc.set){
      var origSet=srcDesc.set;
      Object.defineProperty(imgProto,'src',{
        set:function(url){if(url&&typeof url==='string'&&url.includes('imgur.com'))url=proxyUrl(url);origSet.call(this,url);},
        get:srcDesc.get
      });
    }
  }catch(e){}
  try{
    var stProto=CSSStyleDeclaration.prototype;
    var bgDesc=Object.getOwnPropertyDescriptor(stProto,'backgroundImage');
    if(bgDesc&&bgDesc.set){
      var origBg=bgDesc.set;
      Object.defineProperty(stProto,'backgroundImage',{
        set:function(v){
          if(v&&typeof v==='string'&&v.includes('imgur.com'))
            v=v.replace(/url\(['"]?(https?:\/\/i\.imgur\.com[^'")\s]+)['"]?\)/gi,function(_,u){return"url('"+proxyUrl(u)+"')";});
          origBg.call(this,v);
        },get:bgDesc.get
      });
    }
  }catch(e){}
})();
</script>

<script>
/* ── Skin Preview from localStorage ── */
(function(){
  var DEFAULT_URL='https://i.imgur.com/Fm4r5iM.jpeg';
  var DEFAULT_SKIN="url('"+window.proxyUrl(DEFAULT_URL)+"')";
  var validCache={},pendingSet={};
  function getEl(sel){return document.querySelector(sel);}
  function getSkinUrlsFromStorage(){
    try{
      var n=parseInt(localStorage.getItem('eon_currentProfile')||'1',10);
      var p=JSON.parse(localStorage.getItem('eon_profile_'+n)||'{}');
      return{s1:p.primarySkin||'',s2:p.secondarySkin||''};
    }catch(e){return{s1:'',s2:''};}
  }
  function applyPreview(el,url){
    if(!url||!url.trim()){el.style.backgroundImage=DEFAULT_SKIN;return;}
    el.style.backgroundImage="url('"+(window.proxyUrl ? window.proxyUrl(url) : url)+"')";
  }
  function syncAll(){
    var el1=getEl('.skin-left'),el2=getEl('.skin-right');
    if(!el1&&!el2)return;
    var i1=getEl('.input-skin1'),i2=getEl('.input-skin2');
    var stored=getSkinUrlsFromStorage();
    var url1=(i1&&i1.value.trim())?i1.value.trim():stored.s1;
    var url2=(i2&&i2.value.trim())?i2.value.trim():stored.s2;
    if(el1)applyPreview(el1,url1);
    if(el2)applyPreview(el2,url2);
  }
  window.__jaxSyncSkinPreviews=syncAll;
  window.addEventListener('DOMContentLoaded',function(){
    var i1=getEl('.input-skin1'),i2=getEl('.input-skin2');
    if(i1)i1.addEventListener('input',syncAll);
    if(i2)i2.addEventListener('input',syncAll);
    syncAll();
    setTimeout(function(){syncAll();},1000);
    setInterval(syncAll,600);
  });
})();
</script>

<style>
  /* 1. Chat'in içinde hapsolduğu üst kutunun onu kesmesini (overflow) engelliyoruz */
  /* ==========================================
   PARENT OVERRIDE (Kesilme/Görünmeme Koruması)
   ========================================== */
/* ==========================================
   1. ANA CHAT KUTUSU (SOLA VE EN ALTA ZORLANMIŞ SÜRÜM)
   ========================================== */
html body #chat-container, 
html #chat-container, 
#chat-container {
    position: fixed !important;      
    
    /* 🛠️ ALTTTAKİ BOŞLUĞU YOK EDEN NEGATİF AYAR:
       Sıfır deyince boşluk kalıyorsa, kutuyu zorla aşağı bastırıyoruz.
       Eğer chat çok aşağı kaçarsa bu -20px değerini -10px veya -15px yap.
       Hâlâ boşluk kalırsa -30px, -40px diyerek tam oturana kadar büyüt. */
    bottom: -20px !important;          
    
    /* Soldaki çalışan ayarını aynen koruyoruz */
    left: -30px !important;          
    
    right: auto !important;          
    transform: none !important;      
    margin: 0px !important;          
    padding: 0px !important;         
    box-sizing: border-box !important;
    
    display: flex !important;        
    flex-direction: column !important;
    user-select: none !important;
    width: calc(150px + 12vh) !important; 
    background-color: hsla(0, 0%, 7%, 0.6) !important; 
    
    /* Sadece sağ üst köşe oval, diğer her yer ekrana gömülü */
    border-radius: 0 4px 0 0 !important; 
    
    z-index: 99999999 !important; 
    transition: opacity .1s ease-in !important;
    border: 1px solid rgba(255, 255, 255, 0.05) !important;
    border-left: none !important;    
    border-bottom: none !important;  
}

/* ==========================================
   2. MESAJ ALANI
   ========================================== */
html body #chat-messages {
    flex: 1 !important;              
    max-height: calc(130px + 15vh) !important; 
    overflow-y: scroll !important;
    padding: .5vh !important;
    margin: 0px !important; 
    scrollbar-width: none !important; 
    display: flex !important;
    flex-direction: column-reverse !important; 
}

/* Webkit tarayıcılar için scrollbar gizleme */
#chat-messages::-webkit-scrollbar {
    background: transparent !important;
    width: 0 !important;
    height: 0 !important;
}

/* ==========================================
   3. CHAT MESAJ TARZI (.chbx-message)
   ========================================== */
#chat-messages > div, 
#chat-messages p, 
#chat-messages .message-line {
    font-size: calc(11px + .25vh) !important;
    line-height: calc(12px + .5vh) !important;
    margin-bottom: 1px !important;
    padding: 2px 4px !important;
    color: #bbb !important;
    word-break: break-word !important;
    transition: background-color .1s !important;
}

/* Mesajın üzerine gelince hafif aydınlanma efekti */
#chat-messages > div:hover, 
#chat-messages p:hover {
    background-color: hsla(0, 0%, 100%, 0.1) !important;
}

/* Mesajı gönderen isimleri (.chbx-message-sender) */
#chat-messages strong, 
#chat-messages b, 
#chat-messages .sender {
    color: #ddd !important;
    font-weight: 600 !important;
    margin-right: 3px !important;
}

/* Zaman damgası varsa (.chbx-message-time) */
#chat-messages .time {
    color: #777 !important;
    display: inline-block !important;
    margin-right: 3px !important;
}

/* ==========================================
   4. YAZI YAZMA ALANI (#chat-input)
   Enter'a basınca ekranın alt ortasında açılır
   ========================================== */
/* ==========================================
   1. CHAT INPUT CONTAINER
   ========================================== */
#chat-input-container {
    position: fixed !important;
    background: transparent !important;
    border: none !important;
    z-index: 1000000 !important;
}

/* ==========================================
   2. GİRİŞ ALANI (VARSAYILAN - GİZLİ DURUM)
   ========================================== */
html body #chat-input, 
html #chat-input, 
#chat-input {
    /* 🔒 KESİN ÇÖZÜM: Kutu normalde tamamen hayalet gibi gizli ve tıklanamaz */
    opacity: 0 !important;
    pointer-events: none !important;
    transition: opacity .15s ease-in-out, border .2s ease !important; /* Yumuşakça açılıp kapansın diye */

    background-color: rgba(34, 34, 34, 0.75) !important;
    border: 1px solid transparent !important;
    bottom: 10vh !important;
    color: #bbb !important;
    font-size: calc(8px + .6vh) !important;
    left: 55vw !important;
    outline: none !important;
    padding: 1vh 1.5vh !important;
    position: fixed !important;
    transform: translateX(-50%) !important;
    width: calc(140px + 15vw) !important;
    border-radius: 4px !important;
    z-index: 1000000 !important;
    box-sizing: border-box !important;
}

/* ==========================================
   3. 🔥 ENTER'A BASILDIĞINDA AKTİF OLAN DURUM (FOCUS)
   ========================================== */
html body #chat-input:focus,
html #chat-input:focus,
#chat-input:focus {
    /* 🔓 Kilit Açıldı: Sadece Enter basılıp yazı yazma moduna geçince görünür ve tıklanabilir olur */
    opacity: 1 !important;
    pointer-events: auto !important;
    border: 1px solid rgba(255, 255, 255, 0.2) !important;
}

#chat-input::selection {
    background: #fff !important;
    color: #000 !important;
}

#chat-input::-moz-selection {
    background: #fff !important;
    color: #000 !important;
}

#chat-input::placeholder {
    color: #555 !important;
}

#chat-input::-moz-placeholder {
    color: #555 !important;
}

  <script>
  /* ── Add URL / Primary-Secondary picker for skins ── */
  (function(){
    function $(s){return document.querySelector(s);}
    var pendingUrl = '';
    function showPicker(url){
      pendingUrl = url;
      var p = $('#skinSelectionPopup');
      var prev = $('#skinPopupPreview');
      if (prev) prev.style.backgroundImage = "url('" + (window.proxyUrl ? window.proxyUrl(url) : url) + "')";
      if (p) p.style.display = 'flex';
    }
    function hidePicker(){ var p=$('#skinSelectionPopup'); if(p) p.style.display='none'; pendingUrl=''; }
    function setSlot(which){
      if (!pendingUrl) return hidePicker();
      var sel = which === 1 ? '.input-skin1' : '.input-skin2';
      var el = $(sel);
      if (el) {
        el.value = pendingUrl;
        el.dispatchEvent(new Event('input',  { bubbles: true }));
        el.dispatchEvent(new Event('change', { bubbles: true }));
      }
      // persist into eon_profile_N
      try{
        var n = parseInt(localStorage.getItem('eon_currentProfile')||'1',10);
        var p = JSON.parse(localStorage.getItem('eon_profile_'+n)||'{}');
        if (which === 1) p.primarySkin = pendingUrl; else p.secondarySkin = pendingUrl;
        localStorage.setItem('eon_profile_'+n, JSON.stringify(p));
      }catch(e){}
      if (window.__jaxSyncSkinPreviews) window.__jaxSyncSkinPreviews();
      hidePicker();
    }
    document.addEventListener('DOMContentLoaded', function(){
      var add = $('#btnAddCustomSkin');
      if (add) add.addEventListener('click', function(){
        var u = prompt('Paste skin image URL (jpg/png/webp/gif):');
        if (u && u.trim()) showPicker(u.trim());
      });
      var p1 = $('#btnSetSkinPrimary');   if (p1) p1.addEventListener('click', function(){ setSlot(1); });
      var p2 = $('#btnSetSkinSecondary'); if (p2) p2.addEventListener('click', function(){ setSlot(2); });
      var pc = $('#btnCancelSkin');       if (pc) pc.addEventListener('click', hidePicker);

      // Also let users click any skin tile in the catalog to open the picker
      var content = $('#skinsContent');
      if (content) content.addEventListener('click', function(e){
        var el = e.target.closest('[data-skin-url], .skin-item, .skin-tile, img');
        if (!el) return;
        var url = el.getAttribute('data-skin-url') || el.getAttribute('src') ||
                  (el.style && (el.style.backgroundImage||'').match(/url\(["']?([^"')]+)["']?\)/) || [])[1];
        if (url) { e.stopPropagation(); showPicker(url); }
      }, true);
    });
    window.__jaxShowSkinPicker = showPicker;
  })();
  </script>

<script>
/* ════════════════════════════════════════════════════════════════
   JAX-V5  —  Lobby Wiring Script
   Connects the custom lobby UI to the game engine (bundle.js)
   ════════════════════════════════════════════════════════════════ */
(function () {
  'use strict';
  var __eonApplyingProfile = false;

  /* ── Helper: dispatch events so bundle.js/ryutheme react ── */
  function commitNativeInput(el, val) {
    if (!el) return;
    el.dispatchEvent(new FocusEvent('focus', { bubbles: true }));
    el.value = val;
    el.dispatchEvent(new Event('input',  { bubbles: true }));
    el.dispatchEvent(new Event('change', { bubbles: true }));
    el.dispatchEvent(new FocusEvent('blur', { bubbles: true }));
  }

  /* ── Sync custom inputs → native game internals ── */
  function syncNick1() {
    var v = (document.querySelector('.input-nick1') || {}).value || '';
    /* Try common native nick input IDs (varies by bundle version) */
    var el = document.getElementById('nick-input') ||
             document.getElementById('nick') ||
             document.getElementById('player-name');
    if (el) commitNativeInput(el, v);
    try { if (window.__Be && window.__Be._1059) window.__Be._1059._6988 = v; } catch (_) {}
  }

  function syncNick2() {
    var v = (document.querySelector('.input-nick2') || {}).value || '';
    var el = document.getElementById('nick2-input') || document.getElementById('nick2');
    if (el) commitNativeInput(el, v);
  }

  function syncSkins() {
    /* SKIN PROXY FIX:
     * - The visible value of .input-skin1 / .input-skin2 must be the bare
     *   imgur URL (so users can read/edit it).
     * - The game internals (__Ue / __Be) and app.player.skin1/2 must hold
     *   the proxied URL so the multiplayer relay broadcasts a CORS-safe URL
     *   to other players (their browsers load the skin via /api/proxy).
     */
    var i1 = document.querySelector('.input-skin1');
    var i2 = document.querySelector('.input-skin2');
    var raw1 = (i1 && i1.value) || '';
    var raw2 = (i2 && i2.value) || '';
    if (window.rawSkinUrl) { raw1 = window.rawSkinUrl(raw1); raw2 = window.rawSkinUrl(raw2); }
    /* Normalise the visible input to the bare URL */
    if (i1 && i1.value !== raw1) i1.value = raw1;
    if (i2 && i2.value !== raw2) i2.value = raw2;
    var p1 = window.proxyUrl ? window.proxyUrl(raw1) : raw1;
    var p2 = window.proxyUrl ? window.proxyUrl(raw2) : raw2;
    try {
      if (window.__Ue && window.__Ue._3901) {
        window.__Ue._3901._9315 = p1;
        window.__Ue._3901._8053 = p2;
      }
      if (window.__Be && typeof window.__Be._2263 === 'function') {
        window.__Be._2263(0, p1);
        window.__Be._2263(1, p2);
      }
      if (window.app && window.app.player) {
        window.app.player.skin1 = p1;
        window.app.player.skin2 = p2;
      }
      var ud = JSON.parse(localStorage.getItem('user-data') || 'null');
      if (Array.isArray(ud)) {
        ud[2] = p1; ud[3] = p2;
        localStorage.setItem('user-data', JSON.stringify(ud));
      }
    } catch (_) {}
    if (window.__jaxSyncSkinPreviews) window.__jaxSyncSkinPreviews();
  }

  function syncTag() {
    var v = (document.querySelector('.input-tag') || {}).value || '';
    commitNativeInput(document.getElementById('team-input'), v);
  }

  /* ── Restore saved lobby input values ── */
  function restoreSavedInputs() {
    try {
      var saved = JSON.parse(localStorage.getItem('jaxLobbyInputs') || '{}');
      var n1  = document.querySelector('.input-nick1');
      var n2  = document.querySelector('.input-nick2');
      var s1  = document.querySelector('.input-skin1');
      var s2  = document.querySelector('.input-skin2');
      var tag = document.querySelector('.input-tag');
      function commit(el, val) {
        if (!el) return;
        el.value = val;
        el.dispatchEvent(new Event('input',  { bubbles: true }));
        el.dispatchEvent(new Event('change', { bubbles: true }));
      }
      if (saved.nick1 && n1)  commit(n1, saved.nick1);
      if (saved.nick2 && n2)  commit(n2, saved.nick2);
      if (saved.skin1 && s1)  commit(s1, saved.skin1);
      if (saved.skin2 && s2)  commit(s2, saved.skin2);
      if (saved.tag   && tag) commit(tag, saved.tag);
    } catch (_) {}
  }

  function autoSaveInputs() {
    if (__eonApplyingProfile) return;
    try {
      localStorage.setItem('jaxLobbyInputs', JSON.stringify({
        nick1: (document.querySelector('.input-nick1') || {}).value || '',
        nick2: (document.querySelector('.input-nick2') || {}).value || '',
        skin1: (document.querySelector('.input-skin1') || {}).value || '',
        skin2: (document.querySelector('.input-skin2') || {}).value || '',
        tag:   (document.querySelector('.input-tag')   || {}).value || ''
      }));
    } catch (_) {}
  }

  /* ══════════════════════════════════════════════════════════
     NAV BUTTONS — SHOP / INVENTORY / REPLAYS
     Strategy (two-level):
       1. Call globalThis.__ryuOpenShop/Inventory/Replays directly —
          these are exposed by our patched interface.js and work even
          without a live game server (they create stub #shop-menu,
          #inventory-menu, #gallery elements automatically).
       2. Fall back to clicking native TRB buttons if the game
          connected and created them.
  ══════════════════════════════════════════════════════════ */

  /* Create stub native menu elements so ryutheme inject functions
     can work without a live server connection. */
  function ensureMenuStubs() {
    var stubs = [
      { id: 'inventory-menu', z: 9998 },
      { id: 'gallery',        z: 9997 },
      { id: 'main-menu',      z: 1    }
    ];
    stubs.forEach(function (s) {
      if (!document.getElementById(s.id)) {
        var el = document.createElement('div');
        el.id = s.id;
        el.style.cssText = 'display:block;position:fixed;inset:0;z-index:' +
          s.z + ';background:transparent;pointer-events:none;';
        document.body.appendChild(el);
      }
    });
  }

  /* Wire a nav button: prefer global inject fn, fall back to native btn */
  function wireNavAction(customId, globalFnName, nativeBtnId) {
    var customBtn = document.getElementById(customId);
    if (!customBtn || customBtn._ryuNavWired) return;
    customBtn._ryuNavWired = true;

    customBtn.addEventListener('click', function (e) {
      e.preventDefault();
      ensureMenuStubs();

      /* Prefer direct inject function (works offline) */
      if (typeof window[globalFnName] === 'function') {
        window[globalFnName]();
        return;
      }
      /* Fallback: click native TRB button (requires server) */
      var nb = document.getElementById(nativeBtnId);
      if (nb) nb.click();
    });
  }

  document.addEventListener('DOMContentLoaded', function () {
    ensureMenuStubs();
    wireNavAction('btnInventoryNav', '__ryuOpenInventory', 'mame-trb-inventory-btn');
    wireNavAction('btnReplaysNav',   '__ryuOpenReplays',   'mame-trb-replays-btn');
  });

  /* Also wire after a short delay in case DOM loaded already */
  setTimeout(function () {
    ensureMenuStubs();
    wireNavAction('btnInventoryNav', '__ryuOpenInventory', 'mame-trb-inventory-btn');
    wireNavAction('btnReplaysNav',   '__ryuOpenReplays',   'mame-trb-replays-btn');
  }, 500);

  /* ══════════════════════════════════════════════════════════
     SETTINGS NAV BUTTON
     Prefers ryutheme's ryu-settings-panel, falls back to
     the custom settingsOverlay.
  ══════════════════════════════════════════════════════════ */
  var _settingsTries = 0;
  var _settingsTimer = setInterval(function () {
    _settingsTries++;
    var btn = document.getElementById('btnSettingsNav');
    if (!btn || btn._settingsWired) { if (_settingsTries > 100) clearInterval(_settingsTimer); return; }
    btn._settingsWired = true;
    clearInterval(_settingsTimer);

    btn.addEventListener('click', function () {
      /* Try ryutheme settings panel */
      var nativeSettings = document.getElementById('btnSettings');
      if (nativeSettings) { nativeSettings.click(); return; }
      /* Fallback */
      var ov = document.getElementById('settingsOverlay');
      if (ov) ov.style.display = (ov.style.display === 'none' ? 'flex' : 'none');
    });
  }, 200);

  /* ══════════════════════════════════════════════════════════
     SKIN ORB — opens native custom-skin-menu or fallback overlay
  ══════════════════════════════════════════════════════════ */
  var _skinOrbTries = 0;
  var _skinOrbTimer = setInterval(function () {
    _skinOrbTries++;
    var nativeSkins = document.querySelector('.btn-skins') ||
                      document.getElementById('custom-skin-menu-trigger');
    var orbBtn = document.getElementById('btnOpenSkins');
    if (orbBtn && !orbBtn._skinWired) {
      orbBtn._skinWired = true;
      orbBtn.addEventListener('click', function () {
        if (nativeSkins) { nativeSkins.click(); return; }
        var ov = document.getElementById('skinsOverlay');
        if (ov) ov.style.display = (ov.style.display === 'none' ? 'flex' : 'none');
      });
    }
    if (_skinOrbTries > 80) clearInterval(_skinOrbTimer);
  }, 300);

  /* ══════════════════════════════════════════════════════════
     DOMContentLoaded wiring
  ══════════════════════════════════════════════════════════ */
  document.addEventListener('DOMContentLoaded', function () {

    /* Restore & wire inputs */
    restoreSavedInputs();

    var n1  = document.querySelector('.input-nick1');
    var n2  = document.querySelector('.input-nick2');
    var s1  = document.querySelector('.input-skin1');
    var s2  = document.querySelector('.input-skin2');
    var tag = document.querySelector('.input-tag');

    [n1, n2, s1, s2, tag].forEach(function (el) {
      if (el) { el.addEventListener('input', autoSaveInputs); }
    });
    if (n1)  n1.addEventListener('input',  syncNick1);
    if (n2)  n2.addEventListener('input',  syncNick2);
    if (s1)  s1.addEventListener('input',  syncSkins);
    if (s2)  s2.addEventListener('input',  syncSkins);
    if (tag) tag.addEventListener('input', syncTag);

    /* ── PLAY button ── */
    var playBtn = document.getElementById('btnMenu');
    if (playBtn) {
      playBtn.addEventListener('click', function () {
        syncNick1(); syncNick2(); syncSkins(); syncTag();
        var bp = document.querySelector('.btn-play');
        if (bp) bp.click();
      });
    }

    /* ── SPECTATE button ── */
    var specBtn = document.getElementById('btnSpectate');
    if (specBtn) {
      specBtn.addEventListener('click', function () {
        var bs = document.querySelector('.btn-spectate');
        if (bs) bs.click();
      });
    }

    /* ── Close skins overlay ── */
    var closeSkins = document.getElementById('btnCloseSkins');
    if (closeSkins) {
      closeSkins.addEventListener('click', function () {
        document.getElementById('skinsOverlay').style.display = 'none';
      });
    }

    /* ── Server dropdown ── */
    var trigger   = document.getElementById('serverSelectTrigger');
    var container = document.getElementById('serverSelectContainer');
    if (trigger && container) {
      trigger.addEventListener('click', function (e) {
        e.stopPropagation();
        container.classList.toggle('open');
      });
      document.addEventListener('click', function () { container.classList.remove('open'); });
    }

    /* ── Profile slot selector (FIX: persists nickname/skin/tag per slot) ── */
    function __eonActiveSlot(){
      var num = parseInt(localStorage.getItem('eon_currentProfile') || '1', 10);
      if (isNaN(num) || num < 1 || num > 10) num = 1;
      return num;
    }
    function __eonReadRawProfile(num){
      try { return JSON.parse(localStorage.getItem('eon_profile_'+num) || '{}') || {}; }
      catch(_) { return {}; }
    }
    function __eonNormalizeProfile(p){
      p = p || {};
      return {
        nick1:         p.nick1 || p.primaryNickname || p.name || '',
        nick2:         p.nick2 || p.secondaryNickname || '',
        primarySkin:   p.primarySkin || p.skin1 || '',
        secondarySkin: p.secondarySkin || p.skin2 || '',
        tag:           p.tag || p.lastClanTag || ''
      };
    }
    function __eonProfileHasData(p){
      p = __eonNormalizeProfile(p);
      return !!(p.nick1 || p.nick2 || p.primarySkin || p.secondarySkin || p.tag);
    }
    function __eonWriteProfile(num, patch){
      try {
        var p = __eonReadRawProfile(num);
        for (var k in patch) p[k] = patch[k];
        localStorage.setItem('eon_profile_'+num, JSON.stringify(p));
      } catch(_) {}
    }
    function __eonCaptureCurrent(){
      if (__eonApplyingProfile) return;
      var num = __eonActiveSlot();
      var data = {
        nick1:             (n1  && n1.value)  || '',
        nick2:             (n2  && n2.value)  || '',
        primaryNickname:   (n1  && n1.value)  || '',
        secondaryNickname: (n2  && n2.value)  || '',
        primarySkin:       (s1  && s1.value)  || '',
        secondarySkin:     (s2  && s2.value)  || '',
        tag:               (tag && tag.value) || '',
        lastClanTag:       (tag && tag.value) || ''
      };
      __eonWriteProfile(num, data);
    }
    /* Live-persist edits into the active profile slot */
    [n1, n2, s1, s2, tag].forEach(function(el){
      if (!el) return;
      ['input','change','blur'].forEach(function(ev){
        el.addEventListener(ev, __eonCaptureCurrent);
      });
    });
    /* Also flush on tab close / hide so nothing is lost */
    window.addEventListener('beforeunload',     __eonCaptureCurrent);
    window.addEventListener('pagehide',         __eonCaptureCurrent);
    document.addEventListener('visibilitychange', function(){
      if (document.visibilityState === 'hidden') __eonCaptureCurrent();
    });

    /* ── Initialize: load the persisted active slot on page load ── */
    (function __eonInitActiveSlot(){
      var activeNum = __eonActiveSlot();
      localStorage.setItem('eon_currentProfile', String(activeNum));
      document.querySelectorAll('.profile-slot').forEach(function (s) {
        s.classList.toggle('active', parseInt(s.dataset.slot,10) === activeNum);
      });
      var raw = __eonReadRawProfile(activeNum);
      /* Only override inputs if this slot has saved data; otherwise keep restored generic values */
      if (__eonProfileHasData(raw)) {
        var p = __eonNormalizeProfile(raw);
        __eonApplyingProfile = true;
        if (n1)  n1.value  = p.nick1;
        if (n2)  n2.value  = p.nick2;
        if (s1)  s1.value  = p.primarySkin;
        if (s2)  s2.value  = p.secondarySkin;
        if (tag) tag.value = p.tag;
        __eonApplyingProfile = false;
        syncNick1(); syncNick2(); syncSkins(); syncTag();
      } else {
        /* Seed this slot with whatever was restored from generic storage so nothing is lost */
        __eonCaptureCurrent();
      }
      autoSaveInputs();
    })();

    document.querySelectorAll('.profile-slot').forEach(function (slot) {
      /* Capture-phase mousedown: flush BEFORE the switch click handler runs */
      slot.addEventListener('mousedown', __eonCaptureCurrent, true);

      slot.addEventListener('click', function () {
        /* 1) Save the outgoing profile first */
        __eonCaptureCurrent();

        document.querySelectorAll('.profile-slot').forEach(function (s) { s.classList.remove('active'); });
        slot.classList.add('active');
        var pNum = parseInt(slot.dataset.slot, 10);
        localStorage.setItem('eon_currentProfile', pNum);
        localStorage.setItem('ryuActiveProfile',   String(pNum - 1));

        /* 2) Load the incoming profile */
        var p = __eonNormalizeProfile(__eonReadRawProfile(pNum));
        __eonApplyingProfile = true;
        if (n1)  n1.value  = p.nick1;
        if (n2)  n2.value  = p.nick2;
        if (s1)  s1.value  = p.primarySkin;
        if (s2)  s2.value  = p.secondarySkin;
        if (tag) tag.value = p.tag;
        __eonApplyingProfile = false;
        syncNick1(); syncNick2(); syncSkins(); syncTag();
        autoSaveInputs();
      }, true);
    });

    /* ── Reconnect ── */
    var rcNow = document.getElementById('btnReconnectNow');
    if (rcNow) {
      rcNow.addEventListener('click', function () {
        document.getElementById('reconnectOverlay').style.display = 'none';
        var rcBtn = document.getElementById('btnReconnect') ||
                    document.querySelector('.btn-reconnect-menu');
        if (rcBtn) rcBtn.click();
      });
    }

    /* ════════════════════════════
       TEAM OVERLAY
    ════════════════════════════ */
    var teamBtn     = document.getElementById('btnTeamLobby');
    var teamOverlay = document.getElementById('jaxTeamOverlay');
    var codeInput   = document.getElementById('jaxTeamCodeInput');
    var joinBtn     = document.getElementById('jaxTeamJoinBtn');
    var leaveBtn    = document.getElementById('jaxTeamLeaveBtn');
    var cancelBtn   = document.getElementById('jaxTeamCancelBtn');

    function openTeamOverlay() {
      teamOverlay.style.display = 'flex';
      var nativePin  = document.getElementById('pin-input');
      var nativeTeam = document.getElementById('team-input');
      if (codeInput) {
        codeInput.value = (nativePin && nativePin.value) ||
                          (nativeTeam && nativeTeam.value) || '';
        setTimeout(function () { codeInput.focus(); }, 50);
      }
    }

    function closeTeamOverlay() {
      teamOverlay.style.display = 'none';
    }

    if (teamBtn)   teamBtn.addEventListener('click', openTeamOverlay);
    if (cancelBtn) cancelBtn.addEventListener('click', closeTeamOverlay);

    if (leaveBtn) {
      leaveBtn.addEventListener('click', function () {
        commitNativeInput(document.getElementById('pin-input'),  '');
        commitNativeInput(document.getElementById('team-input'), '');
        if (codeInput) codeInput.value = '';
        closeTeamOverlay();
        if (window.__ryuShowToast) window.__ryuShowToast('Left team.', 'info');
      });
    }

    if (joinBtn) {
      joinBtn.addEventListener('click', function () {
        var code = codeInput ? codeInput.value.trim().toUpperCase() : '';
        /* Write to native pin-input (team PIN join) */
        var nativePin = document.getElementById('pin-input');
        if (nativePin) {
          commitNativeInput(nativePin, code);
        } else {
          /* Fallback: write to team-input */
          commitNativeInput(document.getElementById('team-input'), code);
        }
        /* ryutheme game internals */
        try {
          if (window.__Be && typeof window.__Be._7731 === 'function') window.__Be._7731(code);
        } catch (_) {}
        closeTeamOverlay();
        if (window.__ryuShowToast) {
          window.__ryuShowToast(code ? ('Team PIN set: ' + code) : 'Team PIN cleared.', 'success');
        }
      });
    }

    /* Enter key submits */
    if (codeInput) {
      codeInput.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' && joinBtn) joinBtn.click();
      });
    }

    /* Backdrop click closes */
    if (teamOverlay) {
      teamOverlay.addEventListener('click', function (e) {
        if (e.target === teamOverlay) closeTeamOverlay();
      });
    }

    /* ════════════════════════════
       Stats bar live update
    ════════════════════════════ */
    setInterval(function () {
      try {
        var acc = window.__Be && window.__Be._1059;
        if (!acc) return;
        var rankEl  = document.getElementById('statRank');
        var rpEl    = document.getElementById('statRP');
        var rcEl    = document.getElementById('statRC');
        var lvlEl   = document.getElementById('statLevel');
        var userEl  = document.getElementById('statUser');
        var rank  = (acc._3210 && acc._3210.name) ? acc._3210.name.toUpperCase() : 'UNRANKED';
        var rp    = typeof acc._4622 !== 'undefined' ? acc._4622 : 0;
        var rc    = typeof acc._8841 !== 'undefined' ? acc._8841 : 0;
        var lvl   = typeof acc._6177 !== 'undefined' ? acc._6177 : 0;
        var uname = acc._3290 || '';
        if (!uname) {
          var unEl = document.getElementById('mame-trb-user-data-username');
          uname = unEl ? unEl.textContent.trim() : 'Guest';
        }
        if (rankEl) rankEl.innerHTML = '<i class="fa-solid fa-trophy"></i> ' + rank;
        if (rpEl)   rpEl.innerHTML   = '<i class="fa-solid fa-star"></i> '   + rp + ' RP';
        if (rcEl)   rcEl.innerHTML   = '<i class="fa-solid fa-gem"></i> '    + rc + ' RC';
        if (lvlEl)  lvlEl.innerHTML  = '<i class="fa-solid fa-bolt"></i> LVL ' + lvl;
        if (userEl) userEl.innerHTML = '<i class="fa-solid fa-user"></i> '   + uname;
      } catch (_) {}
    }, 2000);

  }); /* end DOMContentLoaded */

})();
</script>
<script>
window.addEventListener('load', function() {
    var tc = document.getElementById('toast-container');
    if (tc && tc.parentElement !== document.body) {
        document.body.appendChild(tc);
    }
});
</script>
